name: Build Windows

# Build the Windows executable on push to main or manually.
# This workflow is for forks that want to build their own Windows releases.
on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "web/**"
      - "scripts/**"
      - "package.json"
      - "bun.lock"
  workflow_dispatch:
    inputs:
      version_suffix:
        description: "Version suffix (e.g., -fork1)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run tests
        run: bun run test

      - name: Build web assets
        run: bun run build:web

      - name: Generate assets
        run: bun run gen-assets

      - name: Build Windows executable
        run: |
          mkdir -p dist
          bun build src/index.ts --compile --target=bun-windows-x64 --outfile dist/phonedesk-windows-x64.exe

      - name: Verify executable runs
        run: |
          $version = (./dist/phonedesk-windows-x64.exe --version 2>&1) | Out-String
          Write-Host "Built version: $version"
          if (-not $version.Contains("phonedesk")) {
            Write-Error "Executable verification failed"
            exit 1
          }

      - name: Generate SHA256
        run: |
          cd dist
          Get-FileHash -Algorithm SHA256 phonedesk-windows-x64.exe | ForEach-Object { "$($_.Hash.ToLower())  phonedesk-windows-x64.exe" } > SHA256SUMS
          Get-Content SHA256SUMS
          Get-ChildItem phonedesk-*

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: phonedesk-windows-x64
          path: |
            dist/phonedesk-windows-x64.exe
            dist/SHA256SUMS
          retention-days: 30

      - name: Create draft release (manual trigger only)
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $tag = "v$version${{ github.event.inputs.version_suffix }}"
          gh release create $tag dist/phonedesk-windows-x64.exe dist/SHA256SUMS --title "PhoneDesk $tag (Windows)" --draft --generate-notes
